name: CI — Lint · Tests · Eval · Deploy

on:
  push:
    branches: ['**']
    paths-ignore:
      # UI changes never trigger backend CI evaluation
      - 'ui/**'
      - 'docs/**'
      - 'ai_usage/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - 'ai_usage/**'
      - '**.md'

env:
  PYTHON_VERSION: '3.11'

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/ configs/ tests/

      - name: ruff format (check only)
        run: ruff format --check src/ configs/ tests/


  # ── 2. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest (unit)
        run: pytest tests/unit/ --tb=short -q
        env:
          PYTHONPATH: src


  # ── 3. Integration tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Qdrant + Redis
        run: docker compose -f docker/docker-compose.yml up -d qdrant redis

      - name: Wait for services to be healthy
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:6333/healthz && \
            docker exec healthcare_redis redis-cli ping | grep -q PONG && break
            echo "Waiting for services… ($i/20)"
            sleep 3
          done

      - name: pytest (integration)
        run: pytest tests/integration/ --tb=short -q
        env:
          PYTHONPATH: src
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml down


  # ── 4a. Eval — Pipeline phase (40 RAG queries → rows cache) ──────────────
  # Runs the 40 questions through embed → retrieve → generate and saves rows.
  # Uploaded as an artifact so the RAGAS phase can be re-run without re-querying.
  eval-pipeline:
    name: Eval — Pipeline (30 queries)
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-eval.txt

      - name: Pre-flight checks (fail fast before any LLM calls)
        run: |
          python - <<'PYEOF'
          import json, os, sys, urllib.request, urllib.error
          from pathlib import Path

          ok = True

          def check(label, passed, detail=""):
              global ok
              if passed:
                  print(f"  ✓ {label}" + (f" — {detail}" if detail else ""))
              else:
                  print(f"  ✗ {label}" + (f" — {detail}" if detail else ""), file=sys.stderr)
                  ok = False

          print("=== Pre-flight ===")

          # 1. Secrets present (non-empty after strip)
          oai_key  = os.getenv("OPENAI_API_KEY",  "").strip()
          qd_url   = os.getenv("QDRANT_URL",       "").strip()
          qd_key   = os.getenv("QDRANT_API_KEY",   "").strip()
          check("OPENAI_API_KEY set",  bool(oai_key))
          check("QDRANT_URL set",      bool(qd_url),  qd_url or "empty")
          check("QDRANT_API_KEY set",  bool(qd_key))

          # 2. BM25 corpus file present
          bm25 = Path(os.getenv("BM25_CORPUS_PATH", "data/cache/bm25_corpus.pkl"))
          check("BM25 corpus exists", bm25.exists(),
                f"{bm25} ({bm25.stat().st_size:,} B)" if bm25.exists() else str(bm25))

          # 3. Eval set valid JSON with expected questions
          eval_path = Path("data/evaluation/eval_set.json")
          if eval_path.exists():
              try:
                  qs = json.loads(eval_path.read_text())
                  check("Eval set parseable", True, f"{len(qs)} questions")
                  required = {"id", "question", "ground_truth"}
                  bad = [q.get("id","?") for q in qs if not required.issubset(q)]
                  check("All questions have required fields", not bad,
                        f"missing fields in: {bad}" if bad else "")
              except Exception as e:
                  check("Eval set parseable", False, str(e))
          else:
              check("Eval set exists", False, str(eval_path))

          # 4. OpenAI API reachable
          if oai_key:
              req = urllib.request.Request(
                  "https://api.openai.com/v1/models",
                  headers={"Authorization": f"Bearer {oai_key}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      check("OpenAI API reachable", True, f"HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  check("OpenAI API reachable", False, f"HTTP {e.code} — invalid key?")
              except Exception as e:
                  check("OpenAI API reachable", False, str(e))

          # 5. Qdrant cloud reachable
          if qd_url:
              headers = {"api-key": qd_key} if qd_key else {}
              req = urllib.request.Request(f"{qd_url}/healthz", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      check("Qdrant reachable", True, f"HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  check("Qdrant reachable", False, f"HTTP {e.code} — wrong key or URL?")
              except Exception as e:
                  check("Qdrant reachable", False, str(e))

          # 6. Redis (optional — only used to push eval scores at the end)
          #    Warn if missing/unreachable but do NOT block eval.
          redis_url = os.getenv("REDIS_URL", "").strip()
          if not redis_url:
              print("  ⚠ REDIS_URL not set — eval scores will NOT be pushed to Redis (metrics endpoint will have no eval data)")
          else:
              try:
                  import redis as redis_lib
                  r = redis_lib.from_url(redis_url, socket_connect_timeout=10)
                  r.ping()
                  print(f"  ✓ Redis reachable — PONG")
                  r.close()
              except Exception as e:
                  print(f"  ⚠ Redis unreachable — eval scores will not be pushed: {e}")

          print("==================")
          if not ok:
              print("\nPre-flight FAILED — fix the above before retrying.", file=sys.stderr)
              sys.exit(1)
          print("All checks passed.\n")
          PYEOF
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BM25_CORPUS_PATH: data/cache/bm25_corpus.pkl

      - name: Run pipeline phase only (saves rows, skips RAGAS)
        run: |
          python src/evaluation/run_eval.py \
            --rows-cache eval_report.rows.json \
            --output /tmp/eval_report_unused.json \
            2>&1 | head -200 || true
          # Exit 0 here — RAGAS gate is checked in the next job
          # We only need to confirm rows were written
          test -f eval_report.rows.json
        env:
          PYTHONPATH: src
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BM25_CORPUS_PATH: data/cache/bm25_corpus.pkl

      - name: Upload rows cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-rows-${{ github.sha }}
          path: eval_report.rows.json
          retention-days: 3


  # ── 4b. Eval — RAGAS scoring phase (faithfulness gate) ────────────────────
  # Downloads the cached rows and runs RAGAS scoring only — no Qdrant needed.
  # Re-run this job alone if RAGAS times out without re-running the 40 queries.
  eval-ragas:
    name: Eval — RAGAS scoring (faithfulness gate)
    needs: eval-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-eval.txt

      - name: Download pipeline rows cache
        uses: actions/download-artifact@v4
        with:
          name: eval-rows-${{ github.sha }}

      - name: Run RAGAS scoring from cache (no Qdrant calls)
        run: |
          python src/evaluation/run_eval.py \
            --from-cache eval_report.rows.json \
            --output eval_report.json
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Push eval scores to Redis
        if: always()
        run: |
          python - <<'EOF'
          import json, os, sys
          try:
              import redis
              report = json.load(open("eval_report.json"))
              r = redis.from_url(os.environ["REDIS_URL"])
              r.hset("eval:latest", mapping={
                  "faithfulness":      str(report["averages"]["faithfulness"]),
                  "answer_relevancy":  str(report["averages"]["answer_relevancy"]),
                  "context_precision": str(report["averages"]["context_precision"]),
                  "context_recall":    str(report["averages"]["context_recall"]),
                  "num_questions":     str(report["metadata"]["num_questions"]),
                  "errors":            str(report["metadata"]["errors"]),
                  "timestamp":         report["metadata"]["timestamp"],
              })
              print("Eval scores pushed to Redis.")
          except Exception as e:
              print(f"WARNING: could not push eval scores to Redis: {e}", file=sys.stderr)
          EOF
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: eval_report.json
          retention-days: 7

      - name: Post eval report as PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## ❌ RAG Eval Failed — faithfulness below threshold\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('eval_report.json', 'utf8'));
              const { averages, metadata, thresholds } = report;
              body += `**Faithfulness:** ${averages.faithfulness} (threshold: ${thresholds.faithfulness})\n`;
              body += `**Answer Relevancy:** ${averages.answer_relevancy}\n`;
              body += `**Context Precision:** ${averages.context_precision}\n`;
              body += `**Context Recall:** ${averages.context_recall}\n\n`;
              body += `Questions: ${metadata.num_questions} | Errors: ${metadata.errors} | `;
              body += `Pipeline time: ${metadata.pipeline_time_s}s\n\n`;
              body += '<details><summary>Full report</summary>\n\n```json\n';
              body += JSON.stringify(report, null, 2).slice(0, 8000);
              body += '\n```\n</details>';
            } catch (e) {
              body += `Could not parse eval_report.json: ${e.message}`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });


  # ── 5. Deploy to Railway (main branch only, after eval passes) ─────────────
  deploy:
    name: Deploy to Railway
    needs: eval-ragas
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service healthcare-ai --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
