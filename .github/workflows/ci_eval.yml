name: CI — Lint · Tests · Eval · Deploy

on:
  push:
    branches: ['**']
    paths-ignore:
      # UI changes never trigger backend CI evaluation
      - 'ui/**'
      - 'docs/**'
      - 'ai_usage/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - 'ai_usage/**'
      - '**.md'

env:
  PYTHON_VERSION: '3.11'

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/ configs/ tests/

      - name: ruff format (check only)
        run: ruff format --check src/ configs/ tests/


  # ── 2. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest (unit)
        run: pytest tests/unit/ --tb=short -q
        env:
          PYTHONPATH: src


  # ── 3. Integration tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Qdrant + Redis
        run: docker compose -f docker/docker-compose.yml up -d qdrant redis

      - name: Wait for services to be healthy
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:6333/healthz && \
            docker exec healthcare_redis redis-cli ping | grep -q PONG && break
            echo "Waiting for services… ($i/20)"
            sleep 3
          done

      - name: pytest (integration)
        run: pytest tests/integration/ --tb=short -q
        env:
          PYTHONPATH: src
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Stop services
        if: always()
        run: docker compose -f docker/docker-compose.yml down


  # ── 4. RAG Evaluation (faithfulness gate) ─────────────────────────────────
  # Uses qdrant.cloud directly — no local Qdrant needed, no re-ingestion.
  # Requires GitHub secrets: OPENAI_API_KEY, QDRANT_URL, QDRANT_API_KEY.
  eval:
    name: RAG Evaluation
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-eval.txt

      - name: Start Redis only (metrics sink)
        run: docker compose -f docker/docker-compose.yml up -d redis

      - name: Run RAGAS evaluation against qdrant.cloud
        run: python src/evaluation/run_eval.py
        env:
          PYTHONPATH: src
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REDIS_URL: redis://localhost:6379
          BM25_CORPUS_PATH: data/cache/bm25_corpus.pkl

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.sha }}
          path: |
            eval_report.json
            eval_report.rows.json

      - name: Post eval report as PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## ❌ RAG Eval Failed — faithfulness below threshold\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('eval_report.json', 'utf8'));
              const { averages, metadata, thresholds } = report;
              body += `**Faithfulness:** ${averages.faithfulness} (threshold: ${thresholds.faithfulness})\n`;
              body += `**Answer Relevancy:** ${averages.answer_relevancy}\n`;
              body += `**Context Precision:** ${averages.context_precision}\n`;
              body += `**Context Recall:** ${averages.context_recall}\n\n`;
              body += `Questions: ${metadata.num_questions} | Errors: ${metadata.errors} | `;
              body += `Pipeline time: ${metadata.pipeline_time_s}s\n\n`;
              body += '<details><summary>Full report</summary>\n\n```json\n';
              body += JSON.stringify(report, null, 2).slice(0, 8000);
              body += '\n```\n</details>';
            } catch (e) {
              body += `Could not parse eval_report.json: ${e.message}`;
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Stop Redis
        if: always()
        run: docker compose -f docker/docker-compose.yml down redis


  # ── 5. Deploy to Railway (main branch only, after eval passes) ─────────────
  deploy:
    name: Deploy to Railway
    needs: eval
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        run: railway up --service healthcare-ai --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
