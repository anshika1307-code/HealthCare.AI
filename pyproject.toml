[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "healthcare-ai"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]           # PEP 517 src layout — no pip install -e needed
addopts = "-v --tb=short"
markers = [
    "unit: pure logic tests, no I/O",
    "integration: tests that require running services (Qdrant, etc.)",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# src layout: tell Pyright that `src` is the root for imports
pythonPlatform = "All"
reportMissingImports = true

[[tool.pyright.extraPaths]]
path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function calls in default args (FastAPI pattern)
    "B904",  # raise from inside except (noisy in existing code)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # allow unused imports in test files

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
