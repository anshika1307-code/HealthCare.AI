[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "healthcare-ai"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]           # PEP 517 src layout — no pip install -e needed
addopts = "-v --tb=short"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# src layout: tell Pyright that `src` is the root for imports
pythonPlatform = "All"
reportMissingImports = true

[[tool.pyright.extraPaths]]
path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — ruff format handles this
    "B008",  # do not perform function calls in default args (FastAPI pattern)
    "B904",  # raise from inside except (noisy in existing code)
    "B905",  # zip() strict= — pedantic for internally validated pairs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "F401",  # unused imports common in test helpers
    "F811",  # redefinition of unused name (fixture overrides)
    "E402",  # sys.path.insert() must precede project imports in test files
    "I001",  # import sorting conflicts with E402
    "E741",  # ambiguous variable names (l, O, I) acceptable in test assertions
]
# Standalone scripts that manipulate sys.path before importing project modules
"src/evaluation/**" = ["E402", "I001"]
"src/ingestion/run_batch.py" = ["E402", "I001"]
"src/ingestion/preprocessor.py" = ["E402", "I001"]
"scripts/**" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
