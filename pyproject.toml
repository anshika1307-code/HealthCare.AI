[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "healthcare-ai"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]           # PEP 517 src layout — no pip install -e needed
addopts = "-v --tb=short"
markers = [
    "unit: pure logic tests, no I/O",
    "integration: tests that require running services (Qdrant, etc.)",
]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
# src layout: tell Pyright that `src` is the root for imports
pythonPlatform = "All"
reportMissingImports = true

[[tool.pyright.extraPaths]]
path = "src"
